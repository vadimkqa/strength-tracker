name: Merge policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review (never merge directly)
        required: true
        type: string
      head_sha:
        description: Exact 40-character PR head SHA you reviewed
        type: string
        required: false
      reviewed:
        description: I personally reviewed the data-sensitive changes at this exact SHA
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: merge-policy-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  policy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Never check out or execute the PR's code in this privileged workflow.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {run} = require('./scripts/automation/review.cjs');
            await run({github, context, core});

  consider-auto-merge:
    needs: policy
    uses: ./.github/workflows/auto-merge.yml
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || inputs.pr) }}
    secrets:
      AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
