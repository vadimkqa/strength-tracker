name: Guarded auto-merge
on:
  workflow_run:
    workflows: [Deploy GitHub Pages]
    types: [completed]
  workflow_call:
    inputs:
      pr:
        description: PR evaluated by the trusted policy workflow
        type: string
        required: true
    secrets:
      AUTO_MERGE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      pr:
        description: Future PR with the auto-merge label (all safeguards still apply)
        required: true
        type: string
permissions:
  contents: read
jobs:
  enable:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      REQUESTED_PR: ${{ inputs.pr }}
      ENABLED: ${{ vars.ENABLE_GUARDED_AUTO_MERGE }}
      HAS_AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
    steps:
      - name: Report missing configuration
        if: env.ENABLED != 'true' || env.HAS_AUTO_MERGE_TOKEN != 'true'
        run: echo 'Auto-merge is inactive. Configure branch protection, ENABLE_GUARDED_AUTO_MERGE=true and AUTO_MERGE_TOKEN as documented. No PR was changed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.ENABLED == 'true' && env.HAS_AUTO_MERGE_TOKEN == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Enable native auto-merge only for eligible opt-in PRs
        if: env.ENABLED == 'true' && env.HAS_AUTO_MERGE_TOKEN == 'true'
        uses: actions/github-script@v7
        with:
          # A dedicated user/App token makes the resulting main push trigger Pages.
          # Do not fall back to GITHUB_TOKEN, whose generated pushes suppress workflows.
          github-token: ${{ secrets.AUTO_MERGE_TOKEN }}
          script: |
            const {run} = require('./scripts/automation/auto-merge.cjs');
            await run({github, context, core});
