name: Mobile reliability regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        if: matrix.browser == 'chromium'
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run full Chromium suite or targeted WebKit regressions
        run: npx playwright test --config playwright.regression.config.ts
        env:
          REGRESSION_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
